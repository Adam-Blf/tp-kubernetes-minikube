<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon application sur Kubernetes</title>
  <style>
    :root { --navy: #051832; --bleu: #163767; --rose: #FF43B8; --clair: #F4F4F4; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bleu); color: var(--clair);
      font-family: Gilroy, "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 640px; padding: 40px 44px; background: var(--navy); border-radius: 12px; }
    h1 { font-size: 2.2rem; font-weight: 800; }
    h1::after { content: ""; display: block; width: 64px; height: 3px; margin-top: 14px; background: var(--rose); }
    p { line-height: 1.6; margin-top: 18px; }
    footer { margin-top: 28px; font-size: .9rem; color: #C9D3E0; }
  </style>
</head>
<body>
  <main>
    <h1>Mon application sur Kubernetes</h1>
    <p>Bonjour ! Cette page est servie par un conteneur Nginx déployé avec Minikube.</p>
    <footer>EFREI, M2 Data Engineering &amp; IA - TP Kubernetes d'Adam Beloucif et Emilien Morice</footer>
  </main>
</body>
</html>
