name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Build the deliverable archive
        run: |
          mkdir -p dist/rendu-kubernetes
          cp -r README.md reponses.md manifests monapp monapp-deployment.yaml preuves docs dist/rendu-kubernetes/
          (cd dist && zip -r Beloucif_Morice_TP_Kubernetes.zip rendu-kubernetes)
      - name: Extract release notes from the CHANGELOG
        run: awk -v v="$(cat VERSION)" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: monapp
          push: true
          tags: |
            ghcr.io/adam-blf/tp-kubernetes-monapp:${{ github.ref_name }}
            ghcr.io/adam-blf/tp-kubernetes-monapp:${{ github.sha }}
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Beloucif_Morice_TP_Kubernetes.zip --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
